<title>مُغَامَرَةُ الأَفْعَالِ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8e1;--card:#fff;--tx:#37474f;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-size:21px;line-height:1.8}
#app{max-width:580px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{background:#ffd54f;color:#4e342e;border-radius:20px;padding:4px 14px;font-weight:700}
h1{font-size:28px;margin:4px 0;text-align:center}
.owl{font-size:70px;text-align:center;line-height:1.2;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.menu .w{grid-column:1/3}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:10px;color:#fff;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(3px);box-shadow:none}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.v{font-size:36px;font-weight:700;text-align:center}
.s{font-size:26px;text-align:center;line-height:2}
.s b{background:#fff176;color:#333;border-radius:8px;padding:0 8px}
.opts{display:grid;gap:10px}
.back{background:#90a4ae;padding:4px 14px;font-size:17px}
.bar{height:14px;background:#cfd8dc;border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:#66bb6a;transition:width .3s}
.msg{min-height:36px;text-align:center;font-weight:700}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:42px;line-height:1.3}
.lock{filter:grayscale(1);opacity:.3}
.fx{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.small{font-size:16px;opacity:.85;text-align:center}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.chip{background:#cfd8dc;color:#37474f;box-shadow:none;padding:2px 12px;font-size:17px}
.chip.on{background:#7e57c2;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{font-size:20px;min-height:64px}
.sh{animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;padding:8px;border-radius:14px;background:rgba(127,127,127,.15)}
.pr{background:#fff;color:#000;padding:16px;border-radius:8px}
.pr .q{border-bottom:1px dashed #999;padding:4px 0}
.cert{border:8px double #ffa000;text-align:center;padding:24px;background:#fffde7;color:#4e342e;border-radius:12px}
.cert input{font:inherit;font-size:26px;text-align:center;border:0;border-bottom:2px solid #ffa000;background:transparent;width:80%;color:inherit}
table{width:100%;border-collapse:collapse}td{padding:4px;border-bottom:1px solid #ccc}
@media print{body{background:#fff}.noprint{display:none!important}.card{box-shadow:none}}
</style>
</head>

var T=[{n:"الفِعْلُ المَاضِي",s:"مَاضٍ",c:"#ff7043",e:"⏮️",d:"يَدُلُّ عَلَى عَمَلٍ حَدَثَ وَانْتَهَى. قَدْ نَقُولُ مَعَهُ: أَمْسِ، أَوْ قَبْلَ قَلِيلٍ، وَقَدْ لَا نَقُولُ شَيْئًا.",h:"المَاضِي: عَمَلٌ حَدَثَ وَانْتَهَى."},{n:"الفِعْلُ المُضَارِعُ",s:"مُضَارِعٌ",c:"#29b6f6",e:"▶️",d:"يَدُلُّ عَلَى عَمَلٍ يَحْدُثُ الآنَ، أَوْ سَيَحْدُثُ، أَوْ يَتَكَرَّرُ. قَدْ نَقُولُ مَعَهُ: الآنَ، غَدًا، كُلَّ يَوْمٍ، وَقَدْ لَا نَقُولُ شَيْئًا.",h:"المُضَارِعُ: عَمَلٌ يَحْدُثُ الآنَ أَوْ غَدًا أَوْ يَتَكَرَّرُ."},{n:"فِعْلُ الأَمْرِ",s:"أَمْرٌ",c:"#66bb6a",e:"📣",d:"يَطْلُبُ مِنَّا القِيَامَ بِعَمَلٍ، كَأَنَّنَا نَقُولُ لِشَخْصٍ: افْعَلْ. وَقَدْ تَأْتِي بَعْدَهُ عَلَامَةُ تَعَجُّبٍ أَوْ نُقْطَةٌ.",h:"الأَمْرُ: فِيهِ طَلَبٌ لِعَمَلٍ."}];
var STK=["🐱","🦄","🚀","🌈","🐼","👑","🦋","🏆"];
var CH=[[0,"🥚","بَيْضَةٌ صَغِيرَةٌ"],[10,"🐣","كَتْكُوتٌ"],[25,"🐥","فَرْخٌ"],[50,"🦉","بُومَةٌ ذَكِيَّةٌ"],[80,"🦅","نَسْرٌ عَظِيمٌ"]];
var PR=["أَحْسَنْتِ! 🌟","رَائِعٌ جِدًّا! 🎉","مُمْتَازَةٌ! ⭐","أَنْتِ نَجْمَةٌ! 🌈","عَمَلٌ جَمِيلٌ! 👏"];
var st={stars:0,l:0,th:-1,name:"",sess:0,s:[[0,0],[0,0],[0,0]]};
try{var x=JSON.parse(localStorage.getItem("v2"));if(x)st=Object.assign(st,x)}catch(e){}
function save(){try{localStorage.setItem("v2",JSON.stringify(st))}catch(e){}}
function $(h){document.getElementById("app").innerHTML=h}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function P(){return V.filter(function(v){return st.th<0||v[4]==st.th})}
function F(v,k){var r=v[0],a=v[1]=="a"?"َ":"ِ",q={u:"ُ",a:"َ",i:"ِ"}[v[2]],l=st.l;
return k==0?r[0]+"َ"+r[1]+a+r[2]+(l?"ْتُ":"َ"):k==1?(l?"أَ":"يَ")+r[0]+"ْ"+r[1]+q+r[2]+"ُ":(v[2]=="u"?"اُ":"اِ")+r[0]+"ْ"+r[1]+q+r[2]+(l?"ِي":"ْ")}
var TW=[["أَمْسِ","البَارِحَةَ","قَبْلَ قَلِيلٍ","مُنْذُ يَوْمَيْنِ",""],["الآنَ","غَدًا","كُلَّ يَوْمٍ","كُلَّ صَبَاحٍ",""]];
function S(v,k,b){var f="<b>"+(b?"＿＿＿＿":F(v,k))+"</b>",o=v[3],q=function(a){return rnd(b?a.filter(Boolean):a)};
if(k==2)return q([st.l?"يَا سَلْمَى، ":"يَا وَلَدُ، ","","هَيَّا "])+f+" "+o+rnd(["!",".",""]);
var w=q(TW[k]);return w+(w?" ":"")+f+(st.l?"":" الْوَلَدُ")+" "+o+rnd([".",""])}
function plain(h){return h.replace(/<[^>]+>/g,"")}
function rec(k,ok){st.s[k][1]++;if(ok)st.s[k][0]++}
function fx(){for(var i=0;i<14;i++){var s=document.createElement("span");s.className="fx";s.textContent=rnd(["⭐","🎈","✨","🎉","🌟"]);s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},2400,s)}}
var snd=1,ac,SQ=[];
try{snd=localStorage.getItem("vsnd")=="0"?0:1}catch(e){}
function say(){}
function beep(g){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();(g?[523,659,784]:[300,220]).forEach(function(f,i){var o=ac.createOscillator(),n=ac.createGain();o.type=g?"triangle":"sine";o.frequency.value=f;n.gain.value=.12;o.connect(n);n.connect(ac.destination);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.11)})}catch(e){}}
function tg(e){snd=snd?0:1;try{localStorage.setItem("vsnd",snd)}catch(x){}try{speechSynthesis.cancel()}catch(x){}e.textContent=snd?"🔊":"🔇"}
function stage(){var c=CH[0];CH.forEach(function(x){if(st.stars>=x[0])c=x});return c}
function hd(b){return '<div class="top noprint">'+(b?'<button class="back" style="background:#90a4ae" onclick="home()">⬅ الرَّئِيسِيَّةُ</button>':'<span></span>')+'<span><button class="chip" onclick="tg(this)">'+(snd?"🔊":"🔇")+'</button> <span class="badge">⭐ '+st.stars+'</span></span></div>'}
function setL(l){st.l=l;save();home()}
function setT(t){st.th=t;save();home()}
function chips(a,cur,fn){return a.map(function(x,i){return '<button class="chip'+(cur==x[0]?" on":"")+'" onclick="'+fn+'('+x[0]+')">'+x[1]+'</button>'}).join("")}
function home(){var c=stage();$(hd(0)+'<div class="owl">'+c[1]+'</div><h1>مُغَامَرَةُ الأَفْعَالِ</h1><p class="small">أَنَا '+c[2]+' • اجْمَعِي النُّجُومَ لِأَكْبُرَ!</p><div class="chips">'+chips([[0,"سَهْلٌ"],[1,"مُتَوَسِّطٌ"]],st.l,"setL")+'</div><div class="chips">'+chips([[-1,"الكُلُّ"],[0,"🏫 مَدْرَسَةٌ"],[1,"🏠 بَيْتٌ"],[2,"🌳 حَدِيقَةٌ"]],st.th,"setT")+'</div><div class="menu">'+
[["📖 تَعَلَّمِي","#ab47bc","learn()"],["📝 وَرَقَةُ العَمَلِ","#ff7043","quiz('ws')"],["🧺 لُعْبَةُ السِّلَالِ","#29b6f6","quiz('basket')"],["🧩 أَكْمِلِي الجُمْلَةَ","#43a047","quiz('fill')"],["🎈 فَرْقِعِي البَالُونَاتِ","#ec407a","bal()"],["🃏 لُعْبَةُ الذَّاكِرَةِ","#5c6bc0","mem()"],["🔄 حَوِّلِي الفِعْلَ","#00acc1","quiz('conv')"],["🧱 رَتِّبِي الجُمْلَةَ","#8d6e63","ro()"],["🎁 مُكَافَآتِي","#ffa000","rewards()"],["🖨️ أَوْرَاقٌ لِلطِّبَاعَةِ","#607d8b","prt()"],["🎓 شَهَادَةُ التَّقْدِيرِ","#f9a825","cert()"],["👨‍👩‍👧 رُكْنُ وَلِيِّ الأَمْرِ","#546e7a","par()"]].map(function(b){return '<button style="background:'+b[1]+'" onclick="'+b[2]+'">'+b[0]+'</button>'}).join("")+'</div>')}
function learn(){var h=hd(1)+"<h1>📖 تَعَلَّمِي</h1>";SQ=[];T.forEach(function(t,k){var v=rnd(P()),sn=S(v,k);SQ[k]=t.n+". "+t.d+" مِثَالٌ: "+plain(sn);h+='<div class="card" style="border-right:10px solid '+t.c+'"><b style="color:'+t.c+'">'+t.e+" "+t.n+'</b><p>'+t.d+'</p><div class="s">'+S(v,k)+'</div></div>'});$(h+'<button style="background:#ff7043;width:100%;font-size:22px" onclick="quiz(\'ws\')">هَيَّا نَتَدَرَّبُ! 🚀</button>')}
var Q,qi,ok;
function mk(kind){var out=[],p=P();for(var i=0;i<8;i++){var v=rnd(p),k=Math.floor(Math.random()*3);
if(kind=="fill")out.push({k:k,h:'<div class="s">'+S(v,k,1)+'</div>',hint:T[k].h,o:shuf([0,1,2]).map(function(j){return{t:F(v,j),ok:j==k}})});
else if(kind=="conv"){var k1=(k+1+Math.floor(Math.random()*2))%3,w=shuf(p.filter(function(x){return x!=v})).slice(0,2);out.push({k:k,h:'<div class="s">حَوِّلِي «<b>'+F(v,k1)+'</b>» إِلَى '+T[k].s+'</div>',hint:T[k].h,o:shuf([v].concat(w)).map(function(x){return{t:F(x,k),ok:x==v}})})}
else out.push({k:k,h:kind=="ws"?'<div class="s">'+S(v,k)+'</div><p class="small">مَا نَوْعُ الفِعْلِ المُلَوَّنِ؟</p>':'<div class="v">'+F(v,k)+'</div><p class="small">فِي أَيِّ سَلَّةٍ نَضَعُهُ؟ 🧺</p>',hint:T[k].h,o:T.map(function(t,j){return{t:t.s,ok:j==k,c:t.c}})})}return out}
function quiz(kind){Q=mk(kind);qi=0;ok=0;ask(kind)}
function ask(kind){var q=Q[qi],h=hd(1)+'<div class="bar noprint"><i style="width:'+qi/Q.length*100+'%"></i></div><div class="card">'+q.h+'</div><div class="opts">';q.o.forEach(function(o,i){h+='<button style="background:'+(o.c||"#7e57c2")+';font-size:25px" onclick="pick('+i+',\''+kind+'\')">'+(kind=="basket"?"🧺 ":"")+o.t+'</button>'});$(h+'</div><div class="msg" id="msg"></div>')}
function pick(i,kind){var q=Q[qi],m=document.getElementById("msg");
if(q.o[i].ok){if(!q.w){ok++;st.stars++;rec(q.k,1)}save();fx();var pr=rnd(PR);m.textContent=pr;beep(1);say(pr);setTimeout(function(){qi++;qi<Q.length?ask(kind):done()},900)}
else{if(!q.w){q.w=1;rec(q.k,0);save()}m.textContent="حَاوِلِي مَرَّةً أُخْرَى 💪 "+q.hint;beep(0);say("حَاوِلِي مَرَّةً أُخْرَى. "+q.hint)}}
function done(){var b=ok>=7?3:0;st.stars+=b;st.sess++;save();fx();end(ok+" مِنْ "+Q.length,b)}
function end(t,b){beep(1);say("أَحْسَنْتِ! أَنْهَيْتِ التَّمْرِينَ");$(hd(1)+'<div class="owl">🏆</div><h1>أَنْهَيْتِ التَّمْرِينَ!</h1><div class="card s">إِجَابَاتٌ صَحِيحَةٌ: '+t+'<br>'+(b?"مُكَافَأَةٌ: ⭐ × "+b:"كُلُّ مُحَاوَلَةٍ تُقَوِّيكِ! 💛")+'</div><div class="menu"><button style="background:#ffa000" onclick="rewards()">🎁 مُكَافَآتِي</button><button style="background:#29b6f6" onclick="home()">🏠 الرَّئِيسِيَّةُ</button></div>')}
var B;
function bal(){B={r:0,n:0};balR()}
function balR(){var p=shuf(P()),k=Math.floor(Math.random()*3),it=[];for(var i=0;i<6;i++){var kk=i<3?k:(k+1+Math.floor(Math.random()*2))%3;it.push({t:F(p[i],kk),k:kk})}B.k=k;B.it=shuf(it);B.left=3;say("فَرْقِعِي بَالُونَاتِ "+T[B.k].n);balD("")}
function balD(m){var h=hd(1)+'<div class="card s">فَرْقِعِي بَالُونَاتِ <b>'+T[B.k].n+'</b> 🎈<br><small>الجَوْلَةُ '+(B.r+1)+' مِنْ 3</small></div><div class="grid">';B.it.forEach(function(x,i){h+=x.p?'<span></span>':'<button style="background:'+rnd(["#ec407a","#ab47bc","#26a69a","#ff7043"])+';border-radius:50%/60%" onclick="bp('+i+')">'+x.t+'</button>'});$(h+'</div><div class="msg">'+m+'</div>')}
function bp(i){var x=B.it[i];if(x.k==B.k){x.p=1;st.stars++;rec(B.k,1);B.n++;B.left--;save();if(!B.left){B.r++;fx();if(B.r==3){st.stars+=3;st.sess++;save();return end("9 بَالُونَاتٍ",3)}return balR()}beep(1);say(x.t);balD("طَرْقَعَة! 🎉")}else{rec(x.k,0);rec(B.k,0);save();beep(0);say(T[B.k].h);balD("لَيْسَ هَذَا! "+T[B.k].h)}}
var M;
function mem(){var p=shuf(P()),c=[];[0,1,2].forEach(function(k){for(var i=0;i<2;i++){c.push({k:k,t:F(p[k*2+i],k),v:1});c.push({k:k,t:T[k].s,v:0})}});M={c:shuf(c),o:[],d:0,lock:0};memD()}
function memD(){var h=hd(1)+'<div class="card small">طَابِقِي كُلَّ فِعْلٍ مَعَ نَوْعِهِ 🃏</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">';M.c.forEach(function(x,i){var sh=x.m||M.o.indexOf(i)>=0;h+='<button style="background:'+(sh?T[x.k].c:"#7e57c2")+';opacity:'+(x.m?.6:1)+'" onclick="mf('+i+')">'+(sh?x.t:"❓")+'</button>'});$(h+'</div>')}
function mf(i){if(M.lock||M.c[i].m||M.o.indexOf(i)>=0)return;M.o.push(i);say(M.c[i].t);memD();if(M.o.length<2)return;var a=M.c[M.o[0]],b=M.c[M.o[1]];if(a.k==b.k&&a.v!=b.v){a.m=b.m=1;M.o=[];M.d+=2;st.stars++;rec(a.k,1);beep(1);fx();memD();if(M.d==12){st.stars+=3;st.sess++;save();end("6 أَزْوَاجٍ",3)}save()}else{rec(a.k,0);rec(b.k,0);beep(0);M.lock=1;setTimeout(function(){M.o=[];M.lock=0;memD()},1000)}}
var R;
function ro(){R={i:0,ok:0};roN()}
function roN(){var v=rnd(P()),k=Math.floor(Math.random()*3);R.k=k;R.w=plain(S(v,k)).split(" ");R.pool=shuf(R.w.map(function(w,i){return{w:w,i:i}}));R.a=[];roD("")}
function roD(m){var h=hd(1)+'<div class="card small">رَتِّبِي الكَلِمَاتِ لِتُكَوِّنِي جُمْلَةً ('+(R.i+1)+'/5)</div><div class="words">';R.a.forEach(function(x,j){h+='<button style="background:'+T[R.k].c+'" onclick="rr('+j+')">'+x.w+'</button>'});h+='</div><div class="words" style="margin-top:10px">';R.pool.forEach(function(x,j){h+='<button style="background:#7e57c2" onclick="ra('+j+')">'+x.w+'</button>'});$(h+'</div><div class="msg">'+m+'</div>'+(R.pool.length?"":'<button style="background:#43a047;width:100%;font-size:22px" onclick="rc()">✔ تَحَقَّقِي</button>'))}
function ra(j){var x=R.pool.splice(j,1)[0];say(x.w);R.a.push(x);roD("")}
function rr(j){R.pool.push(R.a.splice(j,1)[0]);roD("")}
function rc(){if(R.a.map(function(x){return x.w}).join(" ")==R.w.join(" ")){st.stars+=2;rec(R.k,1);beep(1);say(R.w.join(" "));fx();R.ok++;R.i++;save();if(R.i==5){st.sess++;save();return end(R.ok+" مِنْ 5",0)}roN()}else{rec(R.k,0);save();beep(0);R.pool=R.pool.concat(R.a);R.a=[];roD("جَرِّبِي تَرْتِيبًا آخَرَ 💪")}}
function rewards(){var c=stage(),h=hd(1)+'<h1>🎁 مُكَافَآتِي</h1><div class="card"><div class="owl">'+c[1]+'</div><p class="small">'+c[2]+'</p><div class="stk">';STK.forEach(function(s,i){h+='<span class="'+(st.stars>=(i+1)*5?"":"lock")+'">'+s+'<br><small style="font-size:13px">'+(i+1)*5+' ⭐</small></span>'});$(h+'</div></div>')}
